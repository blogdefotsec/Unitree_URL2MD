name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [lite, full]
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --quiet \
            requests \
            beautifulsoup4 \
            markdownify \
            pyinstaller
          if [ "${{ matrix.mode }}" = "full" ]; then
            pip install --quiet selenium webdriver-manager
          fi

      - name: Export platform tag
        id: info
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   PLAT=linux ;;
            macOS)   PLAT=macos ;;
            Windows) PLAT=windows ;;
          esac
          echo "plat=${PLAT}" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Always use forward slashes — both Git Bash on Windows and PyInstaller accept them
          PROJECT_DIR="$(pwd | tr '\\' '/')"

          COMMON_ARGS=(
            --noconfirm
            --onefile
            --clean
            --name url2md
            --paths "$PROJECT_DIR"
            --hidden-import html_to_md
            --hidden-import markdownify
            --hidden-import bs4
            --hidden-import soupsieve
            --hidden-import requests
            --hidden-import urllib3
            --hidden-import charset_normalizer
            --hidden-import certifi
            --hidden-import idna
            --hidden-import markdown_it
            --hidden-import mdurl
            --hidden-import mdurl._url
            --collect-submodules markdown_it
            --collect-submodules soupsieve
          )

          EXCLUDE_ARGS=()
          if [ "${{ matrix.mode }}" = "lite" ]; then
            EXCLUDE_ARGS=(
              --exclude-module selenium
              --exclude-module trio
              --exclude-module wsproto
              --exclude-module sniffio
              --exclude-module outcome
              --exclude-module webdriver_manager
              --exclude-module sortedcontainers
              --exclude-module attrs
              --exclude-module cffi
              --exclude-module pycparser
              --exclude-module PySocks
              --exclude-module websocket_client
            )
          else
            # full mode: must collect Selenium submodules (they are imported dynamically)
            COMMON_ARGS+=(
              --collect-submodules selenium
              --collect-submodules selenium.webdriver
              --collect-submodules selenium.webdriver.chrome
              --collect-submodules selenium.webdriver.common
              --collect-submodules selenium.webdriver.remote
              --collect-submodules selenium.webdriver.support
              --collect-submodules selenium.common
              --hidden-import selenium.webdriver.chrome.options
              --hidden-import selenium.webdriver.chrome.service
              --hidden-import selenium.webdriver.chrome.webdriver
              --hidden-import selenium.webdriver.common.options
              --hidden-import selenium.webdriver.common.service
              --hidden-import selenium.webdriver.common.by
              --hidden-import selenium.webdriver.common.keys
              --hidden-import selenium.webdriver.common.desired_capabilities
              --hidden-import selenium.webdriver.common.timeouts
              --hidden-import selenium.webdriver.remote.command
              --hidden-import selenium.webdriver.remote.webdriver
              --hidden-import selenium.webdriver.remote.webelement
              --hidden-import selenium.webdriver.remote.remote_connection
              --hidden-import selenium.webdriver.support.wait
              --hidden-import selenium.webdriver.support.expected_conditions
              --collect-submodules webdriver_manager
              --hidden-import webdriver_manager.chrome
              --hidden-import webdriver_manager.core.os_manager
              --hidden-import webdriver_manager.core.logger
              --hidden-import webdriver_manager.core.download_manager
              --collect-submodules trio
              --collect-submodules wsproto
              --hidden-import sniffio
              --hidden-import outcome
              --hidden-import sortedcontainers
              --hidden-import attrs
              --hidden-import cffi
              --hidden-import pycparser
              --hidden-import websocket_client
              --hidden-import PySocks
            )
          fi

          rm -rf build dist url2md.spec __pycache__

          set -x
          python -m PyInstaller "${COMMON_ARGS[@]}" "${EXCLUDE_ARGS[@]}" "$PROJECT_DIR/url2md.py"

      - name: Package artifacts
        id: package
        shell: bash
        env:
          PLAT: ${{ steps.info.outputs.plat }}
          MODE: ${{ matrix.mode }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          BIN_NAME="url2md"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN_NAME="url2md.exe"
          fi

          SRC="dist/${BIN_NAME}"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: Binary not found at $SRC" >&2
            ls -la dist/ || true
            exit 1
          fi

          ARCHIVE_DIR="url2md-${PLAT}-${MODE}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "$SRC" "${ARCHIVE_DIR}/"
          for f in README.md README_CN.md requirements.txt; do
            [ -f "$f" ] && cp "$f" "${ARCHIVE_DIR}/" || true
          done

          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="${ARCHIVE_DIR}.zip"
            python zip_dir.py "$ARCHIVE_DIR" "$ARCHIVE"
          else
            ARCHIVE="${ARCHIVE_DIR}.tar.gz"
            tar -czf "$ARCHIVE" "${ARCHIVE_DIR}"
          fi

          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "plat=${PLAT}" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: url2md-${{ steps.info.outputs.plat }}-${{ matrix.mode }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: ls -la artifacts/

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*
